<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Ocean Tap</title>

<!-- ====== スマホ表示まわり ======
     ピンチ拡大を禁止し、ノッチの裏まで画面いっぱいに使う（viewport-fit=cover） -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- ホーム画面に追加したとき、Safari の枠なしの全画面で起動する -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ocean Tap">
<meta name="theme-color" content="#04132e">
<meta name="format-detection" content="telephone=no">

<!-- ホーム画面アイコン（tools/make-icons.ps1 で作り直せる） -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  /* 画面全体を固定して、スクロール・選択・長押しメニュー・ダブルタップ拡大をすべて無効にする */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04132e;          /* 読み込み中や余白の色。海の底の色に合わせる */
    overscroll-behavior: none;
  }
  body {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;  /* iOS の長押しメニューを出さない */
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* 最初だけ出る操作のヒント。触ると消える */
  #hint {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 36px);
    display: flex;
    justify-content: center;
    gap: 18px;
    color: rgba(255, 255, 255, 0.8);
    font: 13px/1.4 -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    letter-spacing: 0.08em;
    text-shadow: 0 1px 8px rgba(0, 30, 70, 0.7);
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.4s ease;
    z-index: 5;
  }
  #hint.show { opacity: 1; }

  /* ====== 設定パネル ======
     歯車ボタン(#gear)・外側の薄い幕(#scrim)・下から出るパネル(#panel)。
     canvas とは別の要素なので、ここでの操作はゲーム側（波紋・泡・エサ）には届かない */
  #gear {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    width: 44px; height: 44px;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(8, 30, 62, 0.38);
    color: rgba(255, 255, 255, 0.9);
    z-index: 30;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.35s ease, background 0.2s;
  }
  #gear.open { transform: rotate(60deg); background: rgba(8, 30, 62, 0.75); }
  #gear svg { width: 24px; height: 24px; fill: none; stroke: currentColor; }

  #scrim {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 20;
    background: rgba(0, 12, 32, 0.12);
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    transition: opacity 0.25s;
  }
  #scrim.open { opacity: 1; pointer-events: auto; }

  #panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    margin: 0 auto;
    max-width: 560px;
    box-sizing: border-box;
    z-index: 25;
    display: flex; flex-direction: column;
    max-height: 80vh;
    max-height: min(80vh, 600px);
    padding: 8px 18px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: rgba(6, 26, 56, 0.94);
    color: #fff;
    border-radius: 20px 20px 0 0;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-bottom: none;
    box-shadow: 0 -8px 30px rgba(0, 10, 30, 0.4);
    font: 15px/1.4 -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    touch-action: pan-y;
    transform: translateY(105%);
    visibility: hidden;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s 0.3s;
  }
  #panel.open {
    transform: none;
    visibility: visible;
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s;
  }
  /* 上のバー（つまみ）。見た目は細いバーだが、つかめる範囲はパネル上部の幅いっぱい・高さ 36px。
     下へスワイプするとパネルが閉じる（動きは JavaScript の「グラブ」の項） */
  #panel .grab {
    flex: none;
    height: 36px; margin: -8px -18px 0;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
    touch-action: none;           /* この上の縦の動きは、ブラウザのスクロールではなくパネルを下げる操作にする */
  }
  #panel .grab::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.35); }
  #panel.dragging { transition: none; }

  /* パネルの中身。長いときはここだけスクロールする */
  #body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }

  /* 詳細設定の開閉ボタン */
  .more {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; height: 48px; margin-top: 8px; padding: 0 14px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.07);
    color: #fff; font: inherit; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  .more::after { content: ""; width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform 0.25s; }
  .more[aria-expanded="true"]::after { transform: translateY(2px) rotate(-135deg); }
  #adv[hidden] { display: none; }

  /* タブ */
  #tabs { display: flex; gap: 6px; padding: 5px; margin: 4px 0; background: rgba(255, 255, 255, 0.08); border-radius: 13px; }
  .tab {
    flex: 1; height: 44px;
    border: 0; border-radius: 9px;
    background: transparent;
    color: rgba(255, 255, 255, 0.72);
    font: inherit; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  .tab.on { background: rgba(255, 255, 255, 0.2); color: #fff; }

  /* 3つのタブの中身は同じマスに重ねて、いちばん高いものに高さを合わせる（タブを替えても高さが変わらない） */
  #panes { display: grid; }
  .pane { grid-area: 1 / 1; visibility: hidden; }
  .pane.on { visibility: visible; }

  .row { padding: 8px 0 2px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; }
  .val { color: #8fdcff; font-variant-numeric: tabular-nums; }

  /* スライダー：つまみ 30px、押せる高さ 44px */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 44px; margin: 0;
    background: transparent;
    touch-action: pan-y;          /* 横の動きはスライダー、縦の動きはパネルのスクロール */
    --p: 50%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #7fd8ff var(--p), rgba(255, 255, 255, 0.22) var(--p));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 30px; height: 30px; margin-top: -12px;
    border-radius: 50%; border: 0;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
  input[type=range]::-moz-range-track {
    height: 6px; border-radius: 3px;
    background: linear-gradient(to right, #7fd8ff var(--p), rgba(255, 255, 255, 0.22) var(--p));
  }
  input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; border: 0; background: #fff; }

  /* テーマ選択 */
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 4px; }
  .chip {
    height: 50px;
    border-radius: 12px;
    border: 2px solid transparent;
    color: #fff;
    font: inherit; font-weight: 600;
    text-shadow: 0 1px 4px rgba(0, 20, 50, 0.7);
    cursor: pointer; touch-action: manipulation;
  }
  .chip.on { border-color: #fff; }

  /* ON/OFF スイッチ */
  .switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
  .sw {
    position: relative; flex: none;
    width: 56px; height: 34px; padding: 0;
    border: 0; border-radius: 17px;
    background: rgba(255, 255, 255, 0.25);
    cursor: pointer; touch-action: manipulation;
    transition: background 0.2s;
  }
  .sw::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 28px; height: 28px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    transition: transform 0.2s;
  }
  .sw[aria-checked="true"] { background: #4cc9f0; }
  .sw[aria-checked="true"]::after { transform: translateX(22px); }

  .reset {
    width: 100%; height: 48px; margin-top: 10px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    background: transparent; color: #fff;
    font: inherit; cursor: pointer; touch-action: manipulation;
  }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div id="hint"><span>タップ：波紋</span><span>長押し：エサ</span><span>なぞる：泡</span></div>

<!-- 設定パネル（中身のタブ・スライダーは、下の JavaScript の「SCHEMA」から作られる） -->
<div id="ui">
  <button id="gear" type="button" aria-label="設定" aria-expanded="false">
    <!-- 歯車：点線の太い輪（歯）＋輪（本体）＋中心の輪 -->
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.4" stroke-width="3" stroke-dasharray="3.3 3.3"/>
      <circle cx="12" cy="12" r="6.4" stroke-width="2.2"/>
      <circle cx="12" cy="12" r="2.4" stroke-width="2"/>
    </svg>
  </button>
  <div id="scrim"></div>
  <section id="panel" role="dialog" aria-label="設定" aria-hidden="true">
    <div class="grab" id="grab" aria-hidden="true"></div>
    <div id="body">
      <!-- 基本：魚の数とテーマ -->
      <div id="basic"></div>
      <!-- 詳細設定：開くと、タブと「初期値に戻す」が出る -->
      <button id="more" class="more" type="button" aria-expanded="false" aria-controls="adv">詳細設定</button>
      <div id="adv" hidden>
        <div id="tabs" role="tablist"></div>
        <div id="panes"></div>
        <button id="reset" class="reset" type="button">初期値に戻す</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. 設定  ―  まずここをいじると雰囲気や重さを変えられる
   （魚の数・泡の上限などは、画面右上の歯車パネルからも変えられる。
     ここの値は「初期値」で、パネルで変えた値は localStorage に保存される）
   ===================================================================== */
const CONFIG = {
  // ---- 重さに関わる定数（カクつくなら下げる） ----
  FISH_COUNT: 100,       // 魚の数の初期値。重いなら 30〜60 に（自動調整が働くと、重い端末では自然に減る）
  THEME: 'deep',         // テーマの初期値（THEMES のキー: standard / shallow / deep / sunset / reef）
  BIG_FISH_COUNT: 2,     // 奥をゆっくり泳ぐ大きな魚の数
  MIN_FISH_COUNT: 24,    // 自動調整（下記）で減らしても、これ未満にはしない
  AUTO_QUALITY: true,    // true: 重い（目標の約75%未満のfps）と、描画の細かさ → 光の筋 → 魚の数 の順に軽くする
  MAX_DPR: 2,            // 描画の細かさの上限。3 にするとさらに高精細だが重くなる
  AUTO_DPR: 1.5,         // 自動調整で、最初に描画の細かさをここまで下げる（輪郭が少し柔らかくなるだけで、描く量は約4割減る）
  CAP_RETRY_SEC: 30,     // 30fps前後で「上限で止まっている」と判断したあと、次に試すまでの秒数（下の monitor() を参照）
  POWER_SAVE_FPS: 30,    // パネルの「省電力」をONにしたときのコマ数（fps）
  RAY_SCALE: 0.25,       // 光の筋を描く裏キャンバスの細かさ（画面の何倍か）。光の筋はぼやけた絵なので、粗く描いて引き伸ばしても見た目はほぼ同じ
  BUBBLE_LIMIT: 400,   // 泡の最大数の初期値。上限に達したら、古い泡から消して新しい泡を出し続ける
  BUBBLE_LIMIT_MAX: 400, // パネルで上げられる泡の最大数
  PARTICLE_COUNT: 70,    // 漂う小さな粒の数の初期値
  RAY_COUNT: 6,          // 光の筋の本数
  SEAWEED_FAR: 7,        // 奥の海藻の本数
  SEAWEED_NEAR: 4,       // 手前の海藻の本数
  MAX_FOOD: 300,         // エサの最大数。上限に達したら、古いエサから作り直して使い続ける（泡と同じ。入れ物は使い回す）
  THEME_FADE_SEC: 1.6,   // テーマ切り替えで、色が移り変わる秒数

  // ---- 魚の群れの動き（ボイド） ----
  PERCEPTION: 100,       // 仲間を見つける距離
  SEPARATION_K: 1.7,     // 分離：魚の体長の何倍まで近づくと離れるか
  SEPARATION_W: 240,     // 分離の強さ
  ALIGNMENT_W: 1.6,      // 整列の強さ（仲間と向きをそろえる）
  COHESION_W: 0.28,      // 結合の強さ（仲間の中心へ寄る）
  SCHOOL_PULL: 0.05,     // 群れ全体の重心へ戻る弱い力
  TARGET_W: 18,          // 群れが目標点へ向かう力（群れ全体がゆっくり泳ぎ回る）
  WANDER_W: 16,          // 気まぐれに曲がる力
  BOUND_K: 5,            // 画面の端で押し戻す力
  MAX_ACCEL: 120,        // 曲がる力の上限
  SIDE_MARGIN: 46,       // 左右の端からの余白
  TOP_MARGIN: 70,        // 水面側の余白
  BOTTOM_MARGIN: 110,    // 海底側の余白

  // ---- タップで驚く ----
  SCARE_RADIUS: 240,     // 波紋で驚く距離
  FLEE_SPEED: 250,       // 逃げるときの最高速度
  PANIC_TIME: 1.9,       // 驚きが収まるまでの秒数
  WAVE_SPEED: 520,       // 波が伝わる速さ（遠い魚ほど遅れて驚く）

  // ---- 長押しでエサ ----
  LONG_PRESS_MS: 200,    // 長押しと判定する時間（ms）。これより長く押すと、波紋ではなくエサになる
  FEED_RATE_START: 20,   // 長押しし始めに落とすエサの数（個/秒）。パネルの「エサの量」を掛ける
  FEED_RATE_END: 30,     // 長押しを続けたとき、少しずつ増えて行き着く数（個/秒）
  FEED_RAMP_SEC: 5,      // 増え始めてから FEED_RATE_END に届くまでの秒数
  FOOD_SPREAD_R: 16,   // エサが散らばる範囲の半径（px。指の位置を中心に、この円の中へランダムに）
  FOOD_SIZE: [1.0, 2.4], // エサ1粒の半径（px）の範囲。小さい粒が多く、大きい粒は少し。パネルの「エサの大きさ」を掛ける
  FOOD_COLORS: ['#7d4f26', '#94602b', '#a87333', '#bb8736', '#c99a3e', '#d8a448', '#e2923c', '#e8812f'], // 茶色〜黄土色〜オレンジ。粒ごとにどれかが当たる
  FOOD_LIFE: 28,         // エサが消えるまでの秒数
  FOOD_ATTRACT_R: 280,   // 魚がエサに気づく距離
  FOOD_W: 85,            // エサへ向かう力（小さいほどゆっくり集まる）

  // ---- 指でなぞる ----
  MOVE_THRESHOLD: 18,    // これ以上動いたら「なぞる」と判定（px）。長押しの判定を待つ間の指のぶれは、これまで許す
  TRAIL_SPACING: 13,     // 軌跡に泡を出す間隔（px）。パネルの「なぞった時の泡の量」で割る
  TOUCH_PUSH_R: 55,      // なぞる指に魚が避ける距離
  TOUCH_PUSH_W: 260,     // 避ける力

  // ---- 泡と魚（なぞった泡・タップの泡だけ。自動で浮かぶ泡と、魚が食べたときの泡は関係しない） ----
  BUBBLE_HIT_R: 0.35,    // 魚の当たりの半径（体長の何倍か）。泡がここに触れると、弾ける泡なら弾けて、魚がビクッとする
  BUBBLE_POP_CHANCE: 0.5, // 魚に触れたら弾ける泡の割合（泡ごとに、出たときに決まる）。弾けない泡は、触れた魚を強く押し返す
  BUBBLE_FLINCH: 0.4,    // ビクッとして泡から離れる勢い（FLEE_SPEED の何倍か。パネルの「逃げる強さ」も掛かる）
  BUBBLE_PANIC: 0.35,    // ビクッとしたときの驚き度（0〜1。タップの波紋で驚くより弱く、すぐ収まる）
  BUBBLE_WALL_R: 26,     // 泡の縁からこの距離（pt）に入ると、魚は泡を壁のように避ける
  BUBBLE_WALL_W: 320,    // 泡の壁を避ける力
  BUBBLE_WALL_MAX: 1,    // 泡の壁の力の上限（MAX_ACCEL による曲がる力の上限の何倍か）。ほかの力（群れ・目標点・エサ）とは別にかけるので、群れの動きに負けにくい。1.2 以上にすると、エサがあっても壁をほぼ越えなくなる
  POP_LIFE: 0.3,         // 泡が弾けた「パチン」の表示秒数
  POP_MAX: 80,           // 同時に出す「パチン」の最大数（多いときは古いものから消す）

  // ---- タップの衝撃で泡が弾ける（自動で浮かぶ泡も含む。タップで出る泡は除く） ----
  SHOCK_R: 120,          // 弾ける範囲（pt）。泡は、波紋の輪が届いた瞬間に弾ける
  SHOCK_SURE_R: 30,      // この内側の泡は必ず弾ける
  SHOCK_NEAR_CHANCE: 0.5, // SHOCK_SURE_R のすぐ外側で弾ける割合。そこから外側ほど下がり、SHOCK_R で SHOCK_EDGE_CHANCE になる
  SHOCK_EDGE_CHANCE: 0.1,

  // ---- 雰囲気 ----
  AMBIENT_BUBBLE_RATE: 1.5, // 何もしなくても下から浮かぶ泡（個/秒）
};

// URL に ?fish=30 を付けると魚の数を一時的に変えられる（端末ごとの調整用）。
// ?fps を付けると左上に fps が出る。
const params = new URLSearchParams(location.search);
const SHOW_FPS = params.has('fps');

/* 魚の群れの定義。色・大きさ・泳ぐ深さ（z: 0=奥 1=手前）・割合を変えられる */
const SCHOOL_DEFS = [
  { hue: 22,  sat: 92, lit: 58, z: 0.88, size: [20, 28], speed: [44, 58], share: 0.20 }, // オレンジ
  { hue: 48,  sat: 92, lit: 60, z: 0.72, size: [17, 24], speed: [40, 54], share: 0.20 }, // イエロー
  { hue: 172, sat: 72, lit: 52, z: 0.80, size: [19, 26], speed: [42, 56], share: 0.20 }, // ターコイズ
  { hue: 332, sat: 78, lit: 68, z: 0.62, size: [16, 22], speed: [38, 50], share: 0.15 }, // ピンク
  { hue: 205, sat: 50, lit: 78, z: 0.50, size: [11, 16], speed: [48, 64], share: 0.25 }, // 銀青（小さく奥）
];
// 奥をゆっくり泳ぐ大きな影の魚
const BIG_DEF = { hue: 212, sat: 38, lit: 40, z: 0.30, size: [88, 112], speed: [14, 20] };

/* ---- 背景テーマ ----
   新しいテーマは、ここに1つ足すだけで、パネルの選択肢にも出る。
   「作るときだけ使う色」は文字列、「切り替え中に少しずつ変わる色」は数値の配列 [r,g,b(,a)]。
     sea        水の色（上→下の5色）
     glowTop    水面の明るさ
     vignette   周辺の暗がりの濃さ
     farDune / nearDune   奥・手前の砂丘の色 [上, 下]
     rockFar / rockNear   奥・手前の岩の色
